name: fork-build-release

on:
  push:
    branches:
      - main
    tags:
      - "fork-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-build-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build-unix:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - if: ${{ runner.os == 'Linux' }}
        name: Install Linux build dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}
      - name: Build Codex and workflow runtime
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release --target "$TARGET" --bin codex --bin codex-code-mode-host
      - name: Package binaries
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME//\//-}"
          archive="codex-${version}-${TARGET}.tar.gz"
          mkdir -p dist
          tar -C "${CARGO_TARGET_DIR}/${TARGET}/release" -czf "dist/${archive}" codex codex-code-mode-host
      - name: Upload package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ github.ref_name }}-${{ matrix.target }}
          path: codex-rs/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build x86_64-pc-windows-msvc
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: x86_64-pc-windows-msvc
      - name: Configure rusty_v8 artifacts
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: x86_64-pc-windows-msvc
      - name: Build Codex and workflow runtime
        shell: pwsh
        run: cargo build --locked --release --target x86_64-pc-windows-msvc --bin codex --bin codex-code-mode-host
      - name: Package binaries
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Replace('/', '-')
          $archive = "codex-$version-x86_64-pc-windows-msvc.zip"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive `
            -Path "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/codex.exe", "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/codex-code-mode-host.exe" `
            -DestinationPath "dist/$archive"
      - name: Upload package
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ github.ref_name }}-x86_64-pc-windows-msvc
          path: codex-rs/dist/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish fork release
    if: ${{ startsWith(github.ref, 'refs/tags/fork-v') }}
    needs:
      - build-unix
      - build-windows
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: dist/*
          generate_release_notes: true
